# Despliegue automático a Azure App Service con GitHub Actions.
# Configura en GitHub:
#   - Secret:   AZURE_WEBAPP_PUBLISH_PROFILE (contenido del "publish profile" descargado desde Azure)
#   - Variable: AZURE_WEBAPP_NAME (nombre de tu App Service)
name: Deploy a Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
