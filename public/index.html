<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3f6f3" />
  <title>Nexo AI | Asistente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #1b2925;
      --muted: #77827d;
      --line: #e5eae6;
      --paper: #fbfcfa;
      --canvas: #f2f5f1;
      --forest: #183c35;
      --mint: #dff2e8;
      --lime: #c5f36a;
      --coral: #f28d72;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-family: 'DM Sans', sans-serif; }
    button, textarea { font: inherit; }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 264px minmax(0, 1fr); }
    .sidebar { display: flex; flex-direction: column; min-height: 100vh; padding: 26px 18px 18px; color: #eff8f2; background: var(--forest); }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; color: inherit; text-decoration: none; }
    .brand-mark { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 11px; color: var(--forest); background: var(--lime); font-size: 20px; }
    .brand-name { font-size: 16px; font-weight: 700; letter-spacing: 0; }
    .brand-caption { display: block; margin-top: 1px; color: #b8c9c1; font-size: 11px; font-weight: 500; }
    .new-chat { width: 100%; margin: 34px 0 28px; padding: 11px 13px; border: 1px solid #49645d; border-radius: 7px; color: #f8fcf8; background: #244b42; text-align: left; }
    .new-chat:hover { color: #fff; border-color: #779187; background: #2b554a; }
    .new-chat .ti { margin-right: 8px; color: var(--lime); }
    .side-label { padding: 0 10px; color: #aabbb3; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .side-note { margin-top: 12px; padding: 11px 10px; border-radius: 6px; color: #e4eee8; font-size: 12px; }
    .side-note .ti { margin-right: 8px; color: #b8e68f; }
    .sidebar-bottom { margin-top: auto; padding: 18px 8px 0; border-top: 1px solid #39564d; }
    .account { display: flex; align-items: center; gap: 10px; }
    .account-avatar { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 50%; color: var(--forest); background: #d8e8dc; font-size: 12px; font-weight: 700; }
    .account-name { font-size: 12px; font-weight: 600; }
    .account-plan { display: block; color: #b8c9c1; font-size: 11px; }
    .main-panel { display: flex; min-width: 0; min-height: 100vh; flex-direction: column; background: var(--paper); }
    .topbar { display: flex; min-height: 68px; align-items: center; justify-content: space-between; padding: 0 34px; border-bottom: 1px solid var(--line); }
    .topbar-title { font-size: 13px; font-weight: 600; }
    .service-status { display: inline-flex; align-items: center; gap: 7px; color: #587068; font-size: 11px; font-weight: 600; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #55b981; box-shadow: 0 0 0 3px #e2f4e8; }
    .chat-area { display: flex; width: min(100%, 920px); min-height: 0; flex: 1; flex-direction: column; margin: 0 auto; padding: 34px 34px 20px; }
    .conversation { display: flex; min-height: 0; flex: 1; flex-direction: column; gap: 24px; overflow-y: auto; padding: 16px 0 30px; scrollbar-gutter: stable; }
    .welcome { margin: auto auto 28px; text-align: center; animation: arrive .45s ease-out both; }
    .welcome-mark { display: grid; width: 50px; height: 50px; margin: 0 auto 20px; place-items: center; border-radius: 16px; color: var(--forest); background: var(--mint); font-size: 24px; }
    .welcome h1 { margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(32px, 5vw, 43px); font-weight: 500; letter-spacing: 0; }
    .welcome p { margin: 9px 0 0; color: var(--muted); font-size: 14px; }
    .suggestions { display: grid; width: min(100%, 590px); grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 25px auto 0; }
    .suggestion { min-height: 70px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: #fff; text-align: left; transition: border-color .15s ease, transform .15s ease; }
    .suggestion:hover { transform: translateY(-2px); border-color: #9dc5af; }
    .suggestion strong { display: block; margin-bottom: 3px; font-size: 12px; font-weight: 600; }
    .suggestion span { color: var(--muted); font-size: 11px; }
    .message { display: flex; align-items: flex-start; gap: 12px; animation: arrive .25s ease-out both; }
    .message.user { flex-direction: row-reverse; }
    .message-avatar { display: grid; width: 30px; height: 30px; flex: 0 0 30px; place-items: center; border-radius: 10px; color: var(--forest); background: var(--mint); font-size: 15px; }
    .message.user .message-avatar { color: #fff; background: #537c69; font-size: 11px; font-weight: 700; }
    .message-content { max-width: min(78%, 680px); padding: 10px 14px; border-radius: 4px 11px 11px 11px; background: #f1f5f1; color: #273630; font-size: 13px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.user .message-content { border-radius: 11px 4px 11px 11px; background: #e2f2e8; }
    .message.error .message-content { color: #8c402e; background: #fff0eb; }
    .typing .message-content { display: flex; align-items: center; gap: 4px; min-height: 42px; }
    .typing i { width: 5px; height: 5px; border-radius: 50%; background: #81928a; animation: pulse 1s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    .composer-wrap { padding-top: 12px; }
    .composer { display: flex; align-items: flex-end; gap: 12px; padding: 12px; border: 1px solid #dce4dd; border-radius: 9px; background: #fff; box-shadow: 0 8px 24px #183c350d; transition: border-color .15s ease, box-shadow .15s ease; }
    .composer:focus-within { border-color: #84b69b; box-shadow: 0 0 0 3px #dff2e866; }
    .composer textarea { width: 100%; max-height: 180px; min-height: 28px; resize: none; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 13px; line-height: 1.6; }
    .composer textarea::placeholder { color: #929d97; }
    .send-button { display: grid; width: 36px; height: 36px; flex: 0 0 36px; place-items: center; border: 0; border-radius: 7px; color: var(--forest); background: var(--lime); font-size: 18px; transition: transform .15s ease, opacity .15s ease; }
    .send-button:hover { transform: translateY(-1px); background: #b8e65c; }
    .send-button:disabled { cursor: not-allowed; opacity: .5; }
    .composer-hint { margin: 9px 0 0; color: #929d97; font-size: 10px; text-align: center; }
    .toast-message { position: fixed; right: 20px; bottom: 20px; z-index: 5; padding: 10px 14px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: #fff; box-shadow: 0 8px 24px #183c3514; font-size: 12px; }
    @keyframes arrive { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
    @media (max-width: 720px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .topbar { min-height: 58px; padding: 0 18px; }
      .chat-area { min-height: calc(100vh - 58px); padding: 18px 16px 14px; }
      .conversation { gap: 18px; padding-top: 10px; }
      .welcome { margin-bottom: 20px; }
      .welcome p { max-width: 290px; margin-right: auto; margin-left: auto; }
      .suggestions { grid-template-columns: 1fr; gap: 8px; margin-top: 22px; }
      .suggestion { min-height: 58px; }
      .message-content { max-width: 86%; }
      .service-status { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Barra lateral">
      <a class="brand" href="#" aria-label="Nexo AI, inicio">
        <span class="brand-mark"><i class="ti ti-sparkles" aria-hidden="true"></i></span>
        <span class="brand-name">nexo<span class="brand-caption">ASISTENTE IA</span></span>
      </a>
      <button class="new-chat" id="new-chat" type="button"><i class="ti ti-plus" aria-hidden="true"></i> Nueva conversación</button>
      <div class="side-label">Espacio de trabajo</div>
      <div class="side-note"><i class="ti ti-message-circle-2" aria-hidden="true"></i> Conversación actual</div>
      <div class="sidebar-bottom">
        <div class="account">
          <span class="account-avatar">IA</span>
          <span><span class="account-name">Azure AI</span><span class="account-plan">Conectado a tu modelo</span></span>
        </div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <span class="topbar-title">Asistente</span>
        <span class="service-status"><span class="status-dot"></span> Azure AI disponible</span>
      </header>
      <section class="chat-area" aria-label="Chat con el asistente">
        <div class="conversation" id="conversation" aria-live="polite" aria-relevant="additions text">
          <div class="welcome" id="welcome">
            <div class="welcome-mark"><i class="ti ti-sparkles" aria-hidden="true"></i></div>
            <h1>¿Qué tienes en mente?</h1>
            <p>Pregunta, explora una idea o empieza con una sugerencia.</p>
            <div class="suggestions" aria-label="Sugerencias">
              <button class="suggestion" type="button" data-prompt="Ayúdame a organizar mis tareas para esta semana."><strong>Organizar mi semana</strong><span>Convierte pendientes en un plan</span></button>
              <button class="suggestion" type="button" data-prompt="Explícame un tema complejo de forma sencilla, con un ejemplo."><strong>Entender un tema</strong><span>Una explicación clara y práctica</span></button>
              <button class="suggestion" type="button" data-prompt="Ayúdame a mejorar este texto para que sea más claro y conciso."><strong>Mejorar un texto</strong><span>Revisa claridad y tono</span></button>
              <button class="suggestion" type="button" data-prompt="Dame ideas para resolver un problema creativo que tengo."><strong>Buscar ideas</strong><span>Explora nuevas posibilidades</span></button>
            </div>
          </div>
        </div>
        <div class="composer-wrap">
          <form class="composer" id="chat-form">
            <textarea id="prompt" rows="1" aria-label="Escribe tu mensaje" placeholder="Escribe un mensaje..."></textarea>
            <button class="send-button" id="send-button" type="submit" aria-label="Enviar mensaje" title="Enviar mensaje"><i class="ti ti-arrow-up" aria-hidden="true"></i></button>
          </form>
          <p class="composer-hint">Enter para enviar · Shift + Enter para una nueva línea</p>
        </div>
      </section>
    </main>
  </div>
  <script type="module">
    import { handleUserPrompt } from './js/ai-azure.js';

    const conversation = document.querySelector('#conversation');
    const welcome = document.querySelector('#welcome');
    const form = document.querySelector('#chat-form');
    const promptInput = document.querySelector('#prompt');
    const sendButton = document.querySelector('#send-button');
    const chatHistory = [];
    let isSending = false;

    function scrollToLatest() {
      conversation.scrollTo({ top: conversation.scrollHeight, behavior: 'smooth' });
    }

    function addMessage(role, content, isError = false) {
      const row = document.createElement('div');
      row.className = `message${role === 'user' ? ' user' : ''}${isError ? ' error' : ''}`;
      const avatar = document.createElement('span');
      avatar.className = 'message-avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.innerHTML = role === 'user' ? 'T' : '<i class="ti ti-sparkles"></i>';
      const text = document.createElement('div');
      text.className = 'message-content';
      text.textContent = content;
      row.append(avatar, text);
      conversation.append(row);
      scrollToLatest();
      return row;
    }

    function setSending(sending) {
      isSending = sending;
      sendButton.disabled = sending;
      promptInput.disabled = sending;
      sendButton.innerHTML = sending ? '<i class="ti ti-loader-2" aria-hidden="true"></i>' : '<i class="ti ti-arrow-up" aria-hidden="true"></i>';
      sendButton.setAttribute('aria-label', sending ? 'Enviando mensaje' : 'Enviar mensaje');
    }

    async function sendMessage(text) {
      if (isSending || !text.trim()) return;
      const message = text.trim();
      welcome.hidden = true;
      addMessage('user', message);
      promptInput.value = '';
      promptInput.style.height = '28px';
      setSending(true);

      const typing = document.createElement('div');
      typing.className = 'message typing';
      typing.setAttribute('aria-label', 'El asistente está escribiendo');
      typing.innerHTML = '<span class="message-avatar"><i class="ti ti-sparkles" aria-hidden="true"></i></span><span class="message-content"><i></i><i></i><i></i></span>';
      conversation.append(typing);
      scrollToLatest();

      try {
        const response = await handleUserPrompt(message, { messages: chatHistory });
        typing.remove();
        if (response && typeof response === 'object' && response.error) {
          addMessage('assistant', response.error, true);
          return;
        }
        const answer = typeof response === 'string' ? response : 'No recibí una respuesta válida del servicio.';
        addMessage('assistant', answer);
        chatHistory.push({ role: 'user', content: message }, { role: 'assistant', content: answer });
      } catch (error) {
        typing.remove();
        addMessage('assistant', error.message || 'No fue posible conectar con Azure AI.', true);
      } finally {
        setSending(false);
        promptInput.focus();
      }
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      sendMessage(promptInput.value);
    });

    promptInput.addEventListener('input', () => {
      promptInput.style.height = '28px';
      promptInput.style.height = `${Math.min(promptInput.scrollHeight, 180)}px`;
    });

    promptInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll('[data-prompt]').forEach(button => {
      button.addEventListener('click', () => sendMessage(button.dataset.prompt));
    });

    document.querySelector('#new-chat').addEventListener('click', () => {
      if (isSending) return;
      chatHistory.length = 0;
      conversation.replaceChildren(welcome);
      welcome.hidden = false;
      promptInput.value = '';
      promptInput.focus();
    });
  </script>
</body>
</html>
